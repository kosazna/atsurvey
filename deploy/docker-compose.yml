# Production stack for the engine API on the Hetzner VM.
#   cp deploy/.env.example deploy/.env  # fill in values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Hardening: non-root, read-only root filesystem, all Linux capabilities dropped,
# no-new-privileges, process and memory limits, rotated logs. The API is reachable only
# through Caddy (no published port), so X-Forwarded-For is set by Caddy alone.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:-ghcr.io/kosazna/atsurvey-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production  # refuses to start with unsafe settings (see docs/security.md)
      AUTH_DISABLED: "false"
      TRUSTED_PROXY: "true"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
