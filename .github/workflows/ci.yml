name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Engine + API (lint, types, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - name: Design tokens are in sync
        run: uv run python scripts/build_tokens.py --check
      - run: uv run ruff check engine api
      - run: uv run ruff format --check engine api
      - run: uv run pyright
      - run: uv run pytest -q

  database:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostGIS for PostgreSQL 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3
      - run: bash supabase/tests/run.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  webhook:
    name: Paddle webhook unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: node --test supabase/functions/paddle-webhook/signature_test.ts

  web:
    name: Web app (types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  docker:
    name: API image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security checks (dependencies, secrets, CSP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Secret scan
        run: uv run --no-project python scripts/check_secrets.py
      - name: CSP covers inline scripts
        run: uv run --no-project python scripts/check_csp.py
      - name: Python dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --all-packages | grep -v '^-e\|^\./\|^#' > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Web dependencies (pnpm audit, production, high and above)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
