name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Engine + API (lint, types, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - name: Design tokens are in sync
        run: uv run python scripts/build_tokens.py --check
      - run: uv run ruff check engine api
      - run: uv run ruff format --check engine api
      - run: uv run pyright
      - run: uv run pytest -q

  database:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PostGIS for PostgreSQL 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3
      - run: bash supabase/tests/run.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  webhook:
    name: Edge function unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
      - run: node --test supabase/functions/*/*_test.ts

  web:
    name: Web app (types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.28.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  docker:
    name: API image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security checks (dependencies, secrets, CSP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
      - name: Secret scan
        run: uv run --no-project python scripts/check_secrets.py
      - name: CSP covers inline scripts
        run: uv run --no-project python scripts/check_csp.py
      - name: Python dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --all-packages | grep -v '^-e\|^\./\|^#' > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.28.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
      - name: Web dependencies (pnpm audit, production, high and above)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
