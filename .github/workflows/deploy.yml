name: Deploy API

# Builds the API image, pushes it to GHCR and (if the HETZNER_* secrets exist)
# rolls it out on the VM with docker compose.
on:
  push:
    branches: [master, main]
    paths: ["engine/**", "api/**", "uv.lock", "pyproject.toml", "deploy/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atsurvey-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}:latest
            ${{ steps.meta.outputs.tag }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: echo "enabled=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - name: Copy compose files
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/atsurvey"
          strip_components: 1
      - name: Roll out
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/atsurvey
            export API_IMAGE=${{ needs.image.outputs.tag }}:${{ github.sha }}
            sed -i "s|^API_IMAGE=.*|API_IMAGE=$API_IMAGE|" .env
            docker compose --env-file .env pull api
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
