# Supabase CLI configuration (local development).
# Hosted project: link with `supabase link --project-ref <ref>` (EU Frankfurt region).
project_id = "atsurvey"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# The app redirects to its own routes (e.g. /projects) after e-mail links and OAuth.
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "https://app.atsurvey.gr/**",
]
# Same as the hosted project (docs/supabase.md) and the sign-up form.
minimum_password_length = 10
# 15 min: a token copied out of a browser stays usable briefly (the API caches none longer).
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

# Two-factor sign-in (authenticator apps). Enforced by the database: see migration 20261111000005.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Bot protection (Cloudflare Turnstile) is configured on the hosted project only:
# Dashboard → Authentication → Bot and Abuse Protection; the web app shows the widget when
# VITE_TURNSTILE_SITE_KEY is set (docs/supabase.md).

# Google sign-in: off by default (supabase/.env); on when supabase/.env.local (git-ignored) sets
# GOOGLE_AUTH_ENABLED=true and the client id/secret. Steps: docs/supabase.md → Google sign-in.
[auth.external.google]
enabled = "env(GOOGLE_AUTH_ENABLED)"
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.paddle-webhook]
enabled = true
# Paddle cannot send a Supabase JWT; the function verifies the Paddle signature instead.
verify_jwt = false

[functions.storage-janitor]
enabled = true
# Called by pg_cron with the service-role key, which the function compares itself.
verify_jwt = false

[functions.delete-account]
enabled = true
# The function validates the user's token with auth.getUser() (works with ES256 signing keys
# and rejects signed-out sessions), so the gateway check is not needed.
verify_jwt = false

[analytics]
enabled = false
