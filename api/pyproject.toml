[project]
name = "atsurvey-api"
version = "0.1.0"
description = "HTTP API around the atsurvey engine (parse, compute, export)."
requires-python = ">=3.12"
dependencies = [
  "atsurvey[all]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
]

[tool.uv.sources]
atsurvey = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atsurvey_api"]
